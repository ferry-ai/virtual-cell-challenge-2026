# R-LAB, P1: every source of the day plan (§3), with what exists locally and at what level.
# Written by hand from the reports cited in `fonti`; `inventory.py` checks every local path, reads
# its format cheaply and writes availability.csv. Paths under `locale` are relative to the data
# root (VCC2026_DATA_ROOT); `drive` paths are relative to "G:/Il mio Drive/vcc2026/data".
# livello: cellule | aggregati | effetti | de | bulk | annotazioni | metadati | nessuno
# A remote locator is recorded only when a report or a manifest cites it; otherwise it says so.
# Identities of the competition contexts A/B/C are never written here.

sorgenti:
  - id: replogle_k562_gwps
    studio: Replogle et al. 2022, K562 genome-wide Perturb-seq
    modalita: CRISPRi
    contesti: [K562]
    livello_locale: aggregati
    cellule_remote: si
    locale: [external/K562_gwps_raw_bulk_01.h5ad, processed/universe_k562_2026-09-26/]
    drive: [raw/replogle/K562_gwps_raw_singlecell_01.h5ad]
    livello_drive: cellule
    remoto: file a singola cellula già su Drive (65,8 GB); origine Replogle 2022, locatore originale non registrato nei report
    ostacolo: 65,8 GB non stanno sul portatile (1,7 GB liberi); va letto a blocchi su Colab dal Drive
    prossimo_passo: adattatore h5ad a blocchi su Colab, primo shard per target del pannello e controlli, parità con lo stadio 71
    fonti: [reports/analisi/lead_scientist_2026-09-29/TRAINING_COPERTURA.md]
