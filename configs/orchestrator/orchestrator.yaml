# Orchestratore locale — configurazione operativa.
#
# Questo file decide il comportamento. Le risposte dei modelli non possono cambiarlo:
# instradamento, limiti, tentativi e politica di esecuzione si leggono solo da qui.
version: 1

# Dove vivono run, trascrizioni e profili del browser. null = <VCC2026_DATA_ROOT>/orchestrator,
# fuori dal repository perche' il repository sta dentro OneDrive (D-001).
state_root: null

services:
  gemini:
    adapter: gemini_cli
    command: ["gemini"]        # la CLI ufficiale, autenticata con l'account Google
    stdin: true                # il prompt entra da stdin: niente limiti di lunghezza argv
    timeout_seconds: 600
    # model: gemini-2.5-pro    # opzionale; se assente decide la CLI
  grok:
    adapter: web
    profile: grok
    timeout_seconds: 600
    browser_channel: chrome   # il Chrome gia' installato: niente download
    headless: false           # finestra visibile: si guarda cosa succede
  deepseek:
    adapter: web
    profile: deepseek
    family: deepseek          # quale modello c'e' dietro: due sessioni dello stesso
                              # modello condividono la famiglia, e un accordo fra loro
                              # non e' un accordo fra modelli diversi
    timeout_seconds: 600
    modes:
      # Lo stato viene imposto e verificato prima del primo messaggio, invece di fidarsi
      # di cio' che l'interfaccia si ricorda. Se non si riesce a metterlo cosi', non parte
      # niente. I nomi sono descritti in services/deepseek.yaml.
      pensiero_profondo: true
      # ricerca_intelligente: NON si accende qui. Nel ciclo di debug farebbe entrare
      # materiale dal web senza passare dal registro. La modalita' scientific_research
      # la accende da sola, perche' li' il materiale dal web e' il punto e viene
      # registrato: vedi `search:` qui sotto.
    search:
      # Come si accende la ricerca sul web su questo servizio. Il nome deve esistere fra
      # le `modes` descritte in services/deepseek.yaml: l'adattatore lo imposta e ne
      # rilegge lo stato prima del primo messaggio, e se non ci riesce non invia niente.
      # ATTENZIONE a cosa questo compra: sapere che l'interruttore era acceso non e'
      # sapere quali query sono state eseguite. Quelle restano dichiarazioni del worker.
      mode: ricerca_intelligente
    browser_channel: chrome   # il Chrome gia' installato: niente download
    headless: false           # finestra visibile: si guarda cosa succede
  kimi:
    adapter: web
    profile: kimi
    family: kimi
    timeout_seconds: 600
    modes:
      # Solo verificata, non impostabile: se l'interfaccia torna su "Normale" il run si
      # ferma invece di girare in condizioni diverse da quelle dichiarate.
      sforzo_alto: true
    # Nessun blocco `search:`, e non e' una dimenticanza. L'interfaccia di Kimi ha molto
    # probabilmente un interruttore di ricerca; qui non e' mai stato osservato, e un
    # selettore che nessuno ha visto e' un'ipotesi, non una configurazione. Finche' resta
    # cosi', una campagna scientific_research con research.search.required: true si ferma
    # su questo servizio invece di far finta. Per cambiarlo: `orch probe kimi` con il
    # menu aperto, si descrive la modalita' in services/kimi.yaml, poi si aggiunge qui.
    browser_channel: chrome   # il Chrome gia' installato: niente download
    headless: false           # finestra visibile: si guarda cosa succede

  # --- sessioni di riserva su un SECONDO ACCOUNT -----------------------------------
  # NON sono piu' la riserva predefinita: dal 2026-09-14 un posto scoperto viene coperto
  # da una seconda conversazione nella sessione gia' aperta (vedi `stand_in` nel percorso
  # deep_kimi). Questi blocchi restano utili per un caso solo e diverso: un secondo
  # account vero, con cui la riserva non condivide quota ne' disservizio. Finche' non
  # esiste, `orch doctor` puo' dirli `ok` guardando soltanto se la cartella esiste.
  #
  # Servono a un caso solo: un servizio che smette di rispondere mentre l'altro va.
  # La riserva e' una seconda sessione del servizio ANCORA ATTIVO, mai del caduto: se
  # Kimi e' sovraccarica, una seconda Kimi trova lo stesso sovraccarico. Il caricatore
  # rifiuta una riserva della stessa famiglia del titolare proprio per questo.
  #
  # `profile` e' la mappa dei selettori (quale pagina, quali caselle) ed e' la stessa,
  # gia' verificata; `profile_dir` e' la sessione del browser (quale accesso) e deve
  # essere diversa, perche' Chrome non apre due volte la stessa cartella di profilo.
  # Ogni riserva vuole un accesso suo: `orch login deepseek_b`, una volta.
  deepseek_b:
    adapter: web
    profile: deepseek
    profile_dir: deepseek-b
    family: deepseek
    timeout_seconds: 600
    modes:
      pensiero_profondo: true
    browser_channel: chrome
    headless: false
  kimi_b:
    adapter: web
    profile: kimi
    profile_dir: kimi-b
    family: kimi
    timeout_seconds: 600
    modes:
      sforzo_alto: true
    browser_channel: chrome
    headless: false
  manual:
    adapter: manual            # canale di riserva: il prompt lo porti tu, e si vede nel registro
    wait_seconds: 1800

roles:
  framer_a: gemini
  framer_b: grok
  solver_a: deepseek
  solver_b: kimi
  reviewer_a: gemini
  reviewer_b: grok
  solver_manual: manual

routes:
  full:
    frame: [framer_a, framer_b]
    solve: [solver_a, solver_b]
    checkpoint: [reviewer_a]
    review: [reviewer_a, reviewer_b]
  solo_deepseek:
    # Un servizio solo, per collaudare l'adattatore senza coinvolgere nessun altro modello.
    solve: [solver_a]
  solo_kimi:
    solve: [solver_b]
  deep_kimi:
    # Solo il ciclo DeepSeek-Kimi: nessun inquadramento, nessun checkpoint, nessuna
    # revisione affidata ad altri modelli. Gemini, Grok, GPT e Claude non vengono
    # interpellati in nessun momento di questo percorso.
    solve: [solver_a, solver_b]
    stand_in:
      # Chi copre un posto rimasto vuoto. Sempre il servizio che sta ancora rispondendo.
      # Il round mantiene due voci, ma non due modelli: viene detto alla riserva, viene
      # detto al compagno, e finisce nel rapporto e nel motivo di arresto.
      #
      # Dal 2026-09-14 la riserva e' una SECONDA CONVERSAZIONE nella sessione gia' aperta,
      # non un secondo profilo del browser. L'adattatore apre un thread per posto
      # (`WebChatAdapter.conversation_key`), quindi la riserva non legge la chat del
      # titolare. Il profilo separato era una seconda identita' di browser: ereditava la
      # mappa dei selettori verificata e non l'ambiente in cui era stata verificata, ed e'
      # caduto al primo controllo di modalita' nel run delle 11:54 -- l'etichetta
      # 'Pensiero Profondo' non esiste in un'interfaccia in un'altra lingua.
      solver_b: deepseek      # se Kimi non consegna, risponde DeepSeek in un'altra chat
      solver_a: kimi          # se DeepSeek non consegna, risponde Kimi in un'altra chat
  scientific_research:
    # Il ciclo di ricerca scientifica a tre fasi. Stessi due worker del ciclo di debug,
    # campagna diversa: la modalita' la sceglie l'incarico con `mode: scientific_research`,
    # non il percorso. Nessun inquadramento, nessun checkpoint, nessuna revisione affidata
    # ad altri modelli: Gemini, Grok, GPT e Claude non compaiono qui.
    #
    # Nessuna `stand_in` in questa prima versione, e va detto invece di lasciarlo dedurre:
    # una riserva consumerebbe una delle sei risposte del budget, e in un ciclo di
    # ricerca una seconda sessione dello stesso modello che "approfondisce" una pista
    # porterebbe gli stessi punti ciechi in una fase in cui contano le fonti, non le
    # opinioni. Se un worker non consegna, la fase prosegue con una voce sola e il
    # rapporto dice quale fase era dimezzata.
    solve: [solver_a, solver_b]
  duo:
    solve: [solver_a, solver_b]
    review: [reviewer_a]
  single:
    solve: [solver_a]
    review: [reviewer_a]
  manuale:
    solve: [solver_manual]
    review: [reviewer_a]
default_route: full

limits:
  max_rounds: 6                    # vale anche per i cicli "a convergenza": non e' opzionale
  stagnation_rounds: 2
  convergence_rounds: 2
  convergence_similarity: 0.92
  self_similarity_stagnation: 0.97
  disagreement_rounds: 3
  max_wall_clock_minutes: 120
  transport_retries: 2
  absence_tolerance: 2    # round di fila che un servizio puo' saltare prima
                          # che il run si fermi: con uno solo il ciclo prosegue
                          # a una voce, con due diventa un monologo

planning:
  approval: required               # il piano dei sottocompiti lo approvi tu
  checkpoint_every: 0              # 0 = nessun checkpoint intermedio; 2 = ogni due round

outbound:
  # Radici da cui un incarico puo' allegare materiale, oltre alla cartella dell'incarico
  # stesso. Vuota di proposito: cosi' nessun file del progetto parte per sbaglio.
  allowed_roots: []

execution:
  model_code: quarantine           # "run" non e' un valore ammesso: il loader lo rifiuta
