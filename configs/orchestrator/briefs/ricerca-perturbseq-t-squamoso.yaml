# PRIMO INCARICO SCIENTIFICO REALE per la modalita' scientific_research.
#
# NON E' STATO AVVIATO. Nessun messaggio e' partito verso DeepSeek o Kimi con questo
# testo. Va letto e approvato dall'operatore prima di qualunque esecuzione; il comando
# sta in docs/RICERCA_SCIENTIFICA.md §7.
#
# Perche' questa domanda. E' l'incertezza numero 7 di docs/PROGETTO.md §4, ed e' la piu'
# adatta a un primo collaudo reale per tre ragioni: la risposta e' verificabile da una
# persona (o l'accessione esiste e contiene una matrice, o non la contiene), non richiede
# giudizio biologico per essere valutata, e se la risposta fosse positiva sbloccherebbe
# il passo 3 di PROGETTO.md §5, che e' il collo di bottiglia del progetto.
#
# Perche' e' piccola. Tre fasi, sei risposte, due piste, 90 minuti. Un primo collaudo
# serve a vedere se le distinzioni di provenienza reggono su risposte vere, non a
# esaurire la letteratura.
#
# Nessun materiale allegato: outbound.allowed_roots resta vuota e nulla del progetto
# lascia la macchina. Il contesto qui sotto e' scritto a mano e non contiene dati.
id: ricerca-perturbseq-t-squamoso
version: 1
mode: scientific_research
route: scientific_research
title: "Perturb-seq CRISPRi pubblico in linea T matura o epiteliale squamosa"
question: >
  Esiste un dataset Perturb-seq (o CRISPRi a singola cellula) pubblico, con la matrice
  RNA a singola cellula effettivamente ottenibile, in una linea T matura oppure
  epiteliale squamosa? Per ogni candidato: quale linea cellulare, quante perturbazioni,
  quante cellule per perturbazione se dichiarato, e che cosa e' davvero depositato --
  matrice RNA, soli conteggi di guide, o soli metadati.
context: >
  Lavoriamo a una previsione zero-shot di risposta trascrizionale al knockdown in tre
  contesti cellulari mai visti: uno di lignaggio linfoide T, uno epiteliale-mesenchimale,
  uno epiteliale squamoso. Le sorgenti di trasferimento che abbiamo sono di lignaggio
  lontano (K562 eritroide, RPE1). Ci serve sapere se esiste materiale pubblico piu'
  vicino per lignaggio. Una pista gia' nota e' GSE281860, che risulta esporre conteggi di
  guide e non la matrice RNA: se la incontri, dillo e verifica, non darla per acquisita
  sulla nostra parola.
expected_result: >
  Un elenco di candidati, ciascuno con l'accessione dell'archivio, la linea cellulare,
  che cosa e' scaricabile, e il livello a cui la fonte e' stata consultata. Piu' l'elenco
  esplicito di cio' che e' stato cercato senza trovare nulla, con le query che lo dicono.

research:
  scope: >
    Dataset di perturbazione genica a singola cellula con lettura trascrittomica (Perturb-seq,
    CROP-seq, CRISPRi/CRISPRa a singola cellula), depositati in un archivio pubblico, in
    linee T mature (Jurkat, CD4/CD8 primarie, linee T trasformate) o in contesti
    epiteliali squamosi (cheratinociti, carcinoma squamoso, esofago, testa-collo).
    Conta soltanto cio' per cui la matrice RNA a singola cellula e' ottenibile: un
    archivio che espone i soli conteggi di guide non soddisfa il perimetro, e va
    registrato come tale invece che come candidato.
  out_of_scope: >
    K562 e altre linee eritroidi; H1, KOLF2.1J, HIPSCI e altre pluripotenti; RPE1.
    Sono gia' inventariate e non servono. Screening CRISPR a sola lettura di fitness o
    di proliferazione, senza RNA. Dataset non pubblici, sotto accesso controllato
    (dbGaP, EGA): vanno nominati e registrati come non accessibili, non inseguiti.
  relevance_criteria:
    - id: P1
      text: "La fonte nomina un'accessione di archivio pubblico (GEO, ArrayExpress/BioStudies, Zenodo, figshare, SCP) per un esperimento di perturbazione a singola cellula"
    - id: P2
      text: "La linea o il tipo cellulare e' T maturo oppure epiteliale squamoso, dichiarato esplicitamente dalla fonte e non dedotto"
    - id: P3
      text: "La fonte dice che cosa e' depositato: matrice RNA a singola cellula, soli conteggi di guide, pseudobulk, o soli metadati"
    - id: P4
      text: "La fonte riporta il numero di perturbazioni, e se possibile le cellule per perturbazione"
  hypotheses:
    - id: H1
      statement: >
        Esiste almeno un Perturb-seq CRISPRi pubblico in linea T matura con la matrice
        RNA a singola cellula scaricabile senza accesso controllato.
      initial_evidence:
        - "Nessuna: e' una domanda aperta del progetto, registrata in docs/PROGETTO.md §4 punto 7. Non abbiamo evidenze a favore né contro."
      alternatives:
        - "Esistono dataset del genere ma sono sotto accesso controllato, quindi pubblicamente citati e non pubblicamente scaricabili"
        - "Esistono ma in linee T immortalizzate lontane dal contesto della gara, il che li rende poco utili anche se accessibili"
    - id: H2
      statement: >
        Per il contesto epiteliale squamoso non esiste materiale pubblico con matrice RNA,
        e la pista piu' vicina espone soltanto conteggi di guide.
      initial_evidence:
        - "GSE281860 risulta esporre conteggi di guide e non la matrice RNA. E' una nostra osservazione precedente, da verificare, non un dato acquisito."
      alternatives:
        - "Il materiale esiste ma e' depositato fuori da GEO -- Zenodo, figshare, un repository istituzionale -- e non lo abbiamo cercato li'"
        - "Il materiale esiste in un supplemento dell'articolo invece che nell'archivio"
  perspectives:
    solver_a: >
      Metodi e archivi. Parti dalle pagine di accessione e dai file, non dagli articoli:
      che cosa e' stato depositato, in quale formato, con quale granularita'. Quando un
      articolo dichiara una disponibilita' dei dati, verifica che l'accessione la
      rispetti, e se non puoi verificarlo dillo.
    solver_b: >
      Biologia e limiti. Se la linea e' davvero il contesto che dichiara di essere, se
      l'efficienza di knockdown e' riportata e come, e quali limiti gli autori dichiarano
      sul trasferimento ad altri tipi cellulari. Cerca anche i risultati negativi e i
      lavori che riportano trasferimenti falliti.
  lead_assignment: both
  budget:
    max_phases: 3
    max_main_responses: 6
    max_repairs_per_response: 1
    max_leads: 2
    max_total_interactions: 12
    max_wall_clock_minutes: 90
  search:
    required: true
    # plan_only e non halt, e la ragione va detta invece di essere subita: al 2026-09-14
    # DeepSeek ha un interruttore di ricerca che l'adattatore accende e rilegge, Kimi non
    # ne ha nessuno che qualcuno qui abbia osservato. Con `halt` questa campagna non
    # partirebbe affatto. Con `plan_only` parte, e ciascuno dei due viene informato del
    # PROPRIO canale: DeepSeek cerca davvero, Kimi produce un piano di query dichiarate
    # non eseguite e non presenta conoscenza pregressa come risultato di una ricerca.
    #
    # Il prezzo, che il rapporto ripete: le due meta' della campagna non sono
    # confrontabili alla pari, e un accordo fra loro vale meno di quanto sembri. Per
    # rendere simmetrica la campagna serve osservare il controllo di ricerca di Kimi con
    # `orch probe kimi`, descriverlo in services/kimi.yaml e dichiararlo in
    # orchestrator.yaml. Finche' non succede, questa e' la configurazione onesta.
    on_unavailable: plan_only
    note: >
      Poche query mirate, nessuno scaricamento massivo. Una pagina che chiede accesso,
      pagamento o verifica anti-bot ferma la consultazione di quella fonte: si registra
      come non accessibile e si va avanti.
