# Incarico sintetico per la prima esecuzione reale del ciclo DeepSeek-Kimi.
#
# Materiale fornito dall'operatore, interamente inventato: non contiene dati, percorsi o
# risultati del progetto VCC. I criteri di accettazione sono quasi tutti umani, quindi
# l'esito massimo raggiungibile e' la CONVERGENZA delle proposte, mai un completamento
# verificato. L'unico controllo automatico confronta il risultato numerico con un valore
# che l'operatore ha fissato prima di interrogare chiunque: il suo testo non lo rivela.
# v2 era gia' registrata quando il tetto e' passato da 12 a 15 round: il contenuto
# cambia, quindi cambia la versione. Un risultato prodotto con la v2 resta
# riconoscibile come tale.
id: prova-split-e-pairing
version: 3
title: "Revisione critica di uno split e di un confronto fra due loss"
route: deep_kimi

question: |
  1. Individua errori di implementazione e problemi metodologici, distinguendoli.
  2. Per ogni problema mostra un controesempio o una verifica concreta.
  3. Proponi una correzione minima e dichiara le scelte che richiedono una decisione
     dell'operatore.
  4. Calcola a mano il confronto sui casi validi per entrambi i modelli.
  5. Indica cio' che questi dati non permettono di concludere.
  6. Nei round successivi valuta le obiezioni dell'altro worker: accetta quelle fondate e
     motiva eventuali disaccordi. Non modificare una risposta corretta soltanto per
     raggiungere accordo.

context: |
  Stiamo valutando due modelli predittivi. Una loss inferiore e' migliore. L'obiettivo
  dichiarato e' misurare la generalizzazione a linee cellulari mai viste durante il
  training.

  Questo e' il codice proposto:

  import numpy as np

  def split_cells(cells, seed=42):
      """cells: lista di record con cell_id e cell_line."""
      rng = np.random.default_rng(seed)
      indices = rng.permutation(len(cells))
      cut = int(0.8 * len(indices))
      train = [cells[i] for i in indices[:cut]]
      test = [cells[i] for i in indices[cut:]]
      return train, test

  def summarize(loss_a, loss_b):
      """Ogni posizione rappresenta lo stesso caso nei due array."""
      a = np.asarray(loss_a, dtype=float)
      b = np.asarray(loss_b, dtype=float)
      a = a[np.isfinite(a)]
      b = b[np.isfinite(b)]
      delta = a.mean() - b.mean()
      winner = "A" if delta > 0 else "B"
      return {"delta": float(delta), "winner": winner}

  Dati per il confronto:

  case_id:  c1    c2    c3    c4
  loss_a:   0.2   NaN   0.6   0.4
  loss_b:   0.3   0.1   NaN   0.5

  L'autore conclude:
  «Lo split casuale garantisce la valutazione su linee mai viste. Eliminare separatamente
  i valori mancanti mantiene il confronto corretto. Il segno di delta identifica il
  modello migliore.»

  Vincoli: non eseguire codice e non cercare sul web. Se proponi codice, presentalo come
  artefatto non eseguito.

expected_result: |
  Una proposta autonoma che separi gli errori di implementazione dai problemi
  metodologici, sostenga ogni rilievo con un controesempio o una verifica concreta,
  proponga la correzione minima distinguendo cio' che spetta all'operatore, riporti il
  confronto numerico calcolato a mano sui casi validi, e dichiari i limiti di cio' che
  questi dati possono mostrare.

acceptance_criteria:
  - id: C1
    text: "Distingue esplicitamente gli errori di implementazione dai problemi metodologici"
    check: {kind: human}
  - id: C2
    text: "Ogni problema sollevato porta un controesempio o una verifica concreta"
    check: {kind: human}
  - id: C3
    text: "Propone una correzione minima e dichiara le scelte che spettano all'operatore"
    check: {kind: human}
  - id: C4
    text: "Il confronto sui casi validi per entrambi i modelli e' calcolato a mano ed esplicito"
    # v1 usava (?![0-9]) e respingeva -0.100 e -0.10: quattro fallimenti su sei erano
    # falsi negativi del controllo, non errori dei modelli. Ora gli zeri finali passano e
    # -0.11 no. Lezione: un riferimento numerico si verifica sul numero, non sulla forma.
    check: {kind: regex, pattern: '[-−]\s*0[.,]10*(?![1-9])'}
  - id: C5
    text: "Dichiara cio' che questi dati non permettono di concludere"
    check: {kind: human}

limits:
  # Il tetto non e' la fine attesa del ciclo: e' il limite di danno se qualcosa va storto.
  # Con la regola di convergenza corretta (fermi e senza dispute aperte) il ciclo dovrebbe
  # chiudersi da solo intorno al quarto o quinto round; quindici lascia spazio abbondante
  # e tiene il conto delle domande sotto le trenta. Il guardiano che conta davvero e'
  # l'orologio: sei invii hanno richiesto 17 minuti, quindi tre ore restano un margine
  # largo anche a quindici round.
  max_rounds: 15
  max_wall_clock_minutes: 180
