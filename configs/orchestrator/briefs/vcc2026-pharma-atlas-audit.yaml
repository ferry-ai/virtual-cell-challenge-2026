id: vcc2026-pharma-atlas-audit
version: 1
mode: scientific_research
route: scientific_research
title: "Srivatsan, McFaline-Figueroa, Tahoe, scBaseCount: classe di perturbazione"
question: |
  Per ciascuna fonte (sci-Plex 3 Srivatsan 2020, sci-Plex-GxE McFaline-Figueroa
  2024, Tahoe-100M, scBaseCount) stabilisci: CRISPRi / KO / farmaco /
  combinato / osservazionale; controlli (NTC vs vehicle); licenza; se un
  effetto combinato e' separabile. Non trattare un farmaco come knockdown.
  Non trattare dati osservazionali come etichette CRISPRi. Un solo esperimento
  minimo per fonte, oppure un'esclusione documentata.
context: |
  Priorita' operative: Jiang e Jurkat prima. Queste fonti sono la coda.
  Nessun download. K562 di sci-Plex non e' un nuovo contesto CRISPRi.
expected_result: "Tabella classe/controlli/licenza/decisione per le quattro fonti."
research:
  scope: "Le quattro fonti nominate e i loro record primari."
  out_of_scope: "Altri atlanti, download, prestazioni predittive inventate."
  relevance_criteria:
    - id: C1
      text: "Classe di perturbazione e tipo di controllo espliciti."
    - id: C2
      text: "Decisione acquire/defer/exclude con un motivo verificabile."
  hypotheses:
    - id: H1
      statement: "Nessuna delle quattro fornisce etichette CRISPRi confrontabili con Jiang/Nadig senza adattatori."
      initial_evidence: ["Srivatsan e Tahoe sono farmacologici; scBaseCount e' osservazionale."]
      alternatives: ["GxE ha un braccio genetico isolabile con NTC veri."]
  perspectives:
    solver_a: "Record primari e licenze."
    solver_b: "Confondenti dose/tempo/vehicle e rischio di usarli come CRISPRi."
  lead_assignment: both
  budget:
    max_phases: 3
    max_main_responses: 6
    max_repairs_per_response: 1
    max_leads: 1
    max_total_interactions: 12
    max_wall_clock_minutes: 45
  search:
    required: true
    on_unavailable: plan_only
    note: "Nessuna equivalenza farmaco-knockdown."
