id: vcc2026-primeflow-audit
version: 1
mode: scientific_research
route: scientific_research
title: "Audit mirato PRiMeFlow per trasferimento a contesti mai perturbati"
question: |
  Arc raccomanda la lettura di PRiMeFlow nella presentazione VCC2026:
  https://arcinstitute.org/news/virtual-cell-challenge-2026
  Fonte da verificare: https://arxiv.org/abs/2604.13986
  Verifica quali risultati riguardano un contesto mai perturbato nel training e quali
  usano finetuning perturbativo sul contesto di destinazione. Cerca codice e pesi
  ufficiali, dati di pretraining, rappresentazione del target, input NTC e output.
  Determina se esiste un piccolo confronto riproducibile con budget misurabile.
  Non assumere che il risultato su H1 2025 dimostri utilita nel compito 2026.
context: |
  Modelli locali attuali NumPy su CPU, dati pesanti da elaborare in notebook remoto.
  Non e fissato un budget GPU finche il runtime disponibile non e misurato.
  Non occorre il pannello dei 300 geni per questa revisione metodologica.
expected_result: "Tabella affermazione/fonte/sezione/accesso, fattibilita e un solo esperimento minimo o un blocco concreto."
research:
  scope: "Paper PRiMeFlow e relativi repository ufficiali; trasferimento zero-shot di contesto."
  out_of_scope: "Classifiche generiche di modelli, download massivi, dichiarazioni di prestazioni non misurate."
  relevance_criteria:
    - id: C1
      text: "Protocollo che separa contesto nuovo e target nuovo."
    - id: C2
      text: "Codice/pesi/dati identificabili e costo del pilot esplicito oppure ignoto."
  hypotheses:
    - id: H1
      statement: "Il metodo contiene elementi verificabili utili a un pilot zero-shot di contesto."
      initial_evidence: ["La raccomandazione di lettura di Arc non dimostra prestazioni su VCC2026."]
      alternatives: ["Il risultato disponibile dipende da finetuning perturbativo nel contesto query."]
  perspectives:
    solver_a: "Consulta le fonti primarie; separa abstract, testo completo, repository e misure eseguite."
    solver_b: "Verifica split, dipendenze e fattibilita; senza browsing produci solo domande e controlli."
  lead_assignment: both
  budget:
    max_phases: 3
    max_main_responses: 6
    max_repairs_per_response: 1
    max_leads: 1
    max_total_interactions: 12
    max_wall_clock_minutes: 45
  search:
    required: true
    on_unavailable: plan_only
    note: "Usare solo fonti primarie; la ricerca dichiarata non equivale a verifica osservata."
