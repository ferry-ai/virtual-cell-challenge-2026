# Incarico sintetico per il primo collaudo del ciclo DeepSeek-Kimi sui servizi reali.
#
# Innocuo di proposito: non contiene nulla del progetto VCC, nessun dato, nessun percorso.
# Serve a vedere se i due canali reggono un giro di proposta, obiezione e revisione, non a
# imparare qualcosa sul dominio.
#
# I criteri sono tutti umani, e non per pigrizia: su una domanda di questo tipo non esiste
# un valore atteso da fissare in anticipo, quindi il ciclo NON puo' chiudersi come
# "completamento verificato". Il massimo raggiungibile e' la convergenza delle proposte,
# che e' esattamente come va presentata.
id: collaudo-deep-kimi
version: 1
title: "Collaudo - CSV o JSONL per un registro eventi da 10 GB"
question: >
  Un servizio scrive circa 10 GB al mese di eventi applicativi (campi eterogenei, alcuni
  annidati, ritenzione 90 giorni, letture rare ma su intervalli di date). Meglio CSV o
  JSONL? Indica almeno tre criteri di scelta distinti con il compromesso di ciascuno, poi
  una raccomandazione motivata.
context: >
  Compito di collaudo dell'orchestratore: interessa il modo in cui rispondi, non la
  risposta. Non hai accesso a misure reali su questo carico: se citi numeri di prestazioni,
  dichiarali come stime e di' su cosa si basano. Niente strumenti esterni.
expected_result: >
  Una proposta autonoma con: i criteri di scelta e i loro compromessi, una raccomandazione
  esplicita con le condizioni in cui cambierebbe, e la distinzione fra cio' che sai e cio'
  che stai stimando.
route: deep_kimi

acceptance_criteria:
  - id: C1
    text: "Elenca almeno tre criteri di scelta distinti, ciascuno con il suo compromesso"
    check: {kind: human}
  - id: C2
    text: "La raccomandazione e' esplicita e dice in quali condizioni cambierebbe"
    check: {kind: human}
  - id: C3
    text: "Le affermazioni sulle prestazioni sono dichiarate come stime, non come misure"
    check: {kind: human}

limits:
  max_rounds: 3
  max_wall_clock_minutes: 45
