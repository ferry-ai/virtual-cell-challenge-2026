id: vcc2026-jurkat-audit
version: 1
mode: scientific_research
route: scientific_research
title: "Nadig Jurkat: quarto contesto e riconciliazione col mirror HepG2"
question: |
  Verifica Jurkat Nadig (GSE264667) come quarto contesto perturbato, non come
  copertura del pannello 300. Mirror scPerturb: NadigOConner2024_jurkat.h5ad
  su Zenodo 13350497, 1.293.665.804 byte, md5 d8b05d00bfbd686d37ffdd4293bc6c8c.
  La sonda GEO del 12 settembre misura 262.956 x 8.882, obs.gene ==
  'non-targeting' (12.013), 0/300 bersagli del pannello, 8.284 geni in comune
  con l'asse ufficiale. Il mirror HepG2 dello stesso studio ha rinominato i
  controlli in obs.perturbation == 'control' conservando forma e conteggio NTC.
  Distingui GEO originale e mirror: sono lo stesso esperimento. Proponi un
  audit a blocchi e uno split leave-one-context-out che non sommi GEO e mirror.
context: |
  HepG2 dello stesso studio e gia' locale. K562/RPE1/HepG2 formano il
  benchmark a tre contesti. Jurkat e' T-linfoblastoide, utile per A, con
  copertura pannello zero. Non scaricare la matrice. Il pannello e' allegato.
materials:
  - id: M1
    path: materiali/vcc2026-panel-2026-09-15.csv
expected_result: "Schema GEO vs mirror, NTC, split, costo, nessuna copertura dichiarata senza file."
research:
  scope: "Nadig Jurkat GSE264667 e il mirror scPerturb collegato."
  out_of_scope: "Altri Jurkat (Song TAP-seq), download, GPU."
  relevance_criteria:
