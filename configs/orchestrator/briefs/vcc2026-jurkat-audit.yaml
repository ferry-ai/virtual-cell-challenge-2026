      initial_evidence: ["HepG2 dello stesso record ha gia' mostrato il rename control/non-targeting."]
      alternatives: ["Il mirror filtra o riassegna cellule."]
  perspectives:
    solver_a: "Fonti primarie e record Zenodo."
    solver_b: "Controlli di identita' esperimento e piano di memoria."
  lead_assignment: both
