id: vcc2026-jiang-audit
version: 1
mode: scientific_research
route: scientific_research
title: "Jiang: audit dati e split per il primo pilot remoto VCC2026"
question: |
  Verifica il dataset Jiang consigliato dalla challenge: sei linee A549, MCF7, HT29,
  HAP1, BxPC3, K562. Fonti primarie: https://github.com/satijalab/Mixscale e
  https://zenodo.org/records/14518762 ; GEO GSE281048.
  Il record Zenodo espone cinque Seurat RDS divisi per stimolo (2,6-5,6 GB ciascuno).
  Trova schema dei metadati, counts RNA non normalizzati, NTC, target e guide,
  stimolo/dose/tempo/batch, formato e prerequisiti R per conversione a blocchi.
  Distingui dimensioni del file da RAM necessaria per readRDS; non inventare stime misurate.
  Il pannello ufficiale attuale e allegato come M1. Conta la sovrapposizione solo
  se hai effettivamente accesso a un elenco di target della sorgente, citandolo;
  altrimenti consegna URL e procedura esatta all'implementatore.
  Proponi un pilot su un solo blocco e uno split che escluda una linea con tutti
  i suoi stimoli. Non usare firme DE calcolate sull'intero studio come feature
  di target unseen. Non confondere variazione di stimolo e nuova linea cellulare.
context: |
  L'utente ha account Kaggle/Colab e accetta training a checkpoint; quote ignote.
  Nessun download massivo dai worker. Vogliamo capire prima se la sorgente aggiunge
  contesti perturbati confrontabili. Sono gia disponibili K562/RPE1/HepG2, quindi
  K562 non e una nuova linea, pur potendo essere un esperimento nuovo.
  Non accedere ad account, credenziali o file non allegati.
materials:
  - id: M1
    path: materiali/vcc2026-panel-2026-09-15.csv
expected_result: "Scheda fonti/file/metadati/limiti, copertura solo se verificabile, pilot riprendibile e split senza leakage."
research:
  scope: "Jiang/Mixscale e risorse primarie collegate."
  out_of_scope: "Ricerca generica di altri atlanti, download matrici, promesse di GPU o prestazioni."
  relevance_criteria:
    - id: C1
      text: "Counts e NTC abbinabili per linea, stimolo e batch."
    - id: C2
      text: "Pilot remoto riproducibile senza caricare l'intero studio."
  hypotheses:
    - id: H1
      statement: "Un blocco Jiang permette confronto tra linee con knockdown e stimolo confrontabili."
      initial_evidence: ["Record Zenodo disponibile, matrici non aperte in questa sessione."]
      alternatives: ["Metadati, stimoli o target impediscono il confronto richiesto."]
  perspectives:
    solver_a: "Ricerca primaria di metadati, conteggi e modalita di accesso."
    solver_b: "Revisione critica di split, controlli e piano di memoria; senza web segnala i controlli da eseguire."
  lead_assignment: both
  budget:
    max_phases: 3
    max_main_responses: 6
    max_repairs_per_response: 1
    max_leads: 2
    max_total_interactions: 12
    max_wall_clock_minutes: 45
  search:
    required: true
    on_unavailable: plan_only
    note: "Dichiarare accesso effettivo e limiti; mai dedurre la copertura dalla sola scala dello studio."
