id: vcc2026-validation-review
version: 1
route: deep_kimi
title: "Review del protocollo per decidere il prossimo candidato VCC2026"
question: |
  Verifica questo disegno prima dell'implementazione. Abbiamo tre contesti perturbati
  esterni. Vogliamo generalizzare a un nuovo contesto dato solo il suo basale NTC.
  Separiamo target visti altrove e target esclusi da tutte le sorgenti di training.
  Proponiamo confronto appaiato di ShrunkTransfer e un candidato semplice, incrociati
  con due generatori. Fit, scelta e calibrazione usano solo fold interni.
  Il test esterno usa sei metriche con ancore locali di media perturbativa e replicato.
  I precedenti test esterni sono gia stati consultati e sono quindi sviluppo.
  Individua leakage, confondimento contesto/studio, calibrazione non equivalente,
  incertezza delle ancore, bootstrap errato e problemi del confronto tra generatori.
  Per ciascun rischio fornisci un controesempio minimo e un controllo implementabile.
  Proponi un unico test decisivo e specifica cosa non si puo concludere con tre linee.
context: |
  Incarico metodologico, senza file cellulari, codice o browsing richiesto.
  Non puoi verificare risultati sperimentali. Non inventare soglie o prestazioni.
  I controlli query sono ammessi; le loro perturbazioni non sono disponibili al modello.
  Un seed diverso sugli stessi dati non crea una conferma biologica indipendente.
  Ogni proposta di codice resta non eseguita fino alla verifica dell'implementatore.
expected_result: "Massimo sei rischi ordinati, controlli concreti, singolo esperimento decisivo e limiti."
acceptance_criteria:
  - id: C1
    text: "Distingue selezione interna, conferma esterna e uso delle ancore"
    check: {kind: human}
  - id: C2
    text: "Ogni rischio include un controesempio e un controllo implementabile"
    check: {kind: human}
  - id: C3
    text: "Non scambia seed o cellule per repliche biologiche indipendenti"
    check: {kind: human}
limits:
  max_rounds: 2
  max_wall_clock_minutes: 30
