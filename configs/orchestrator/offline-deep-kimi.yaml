# Prova a secco del percorso deep_kimi: stessa forma del percorso reale (solo il ciclo a
# due, nessun altro modello), ma le risposte arrivano da file scritti a mano.
# Serve a vedere il comportamento del motore prima di spendere una sessione vera.
version: 1
state_root: null

services:
  scripted:
    adapter: scripted
    script_dir: "rehearsal/collaudo-deep-kimi"   # relativo a questo file

roles:
  solver_a: scripted
  solver_b: scripted

routes:
  deep_kimi:
    solve: [solver_a, solver_b]
default_route: deep_kimi

limits:
  max_rounds: 3
  stagnation_rounds: 2
  convergence_rounds: 2
  convergence_similarity: 0.92
  self_similarity_stagnation: 0.97
  disagreement_rounds: 3
  max_wall_clock_minutes: 20
  transport_retries: 0

planning:
  approval: auto
  checkpoint_every: 0

outbound:
  allowed_roots: []

execution:
  model_code: quarantine
