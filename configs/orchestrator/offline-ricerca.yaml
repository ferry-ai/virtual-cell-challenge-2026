# Prova a secco della modalita' scientific_research: stessa forma del percorso reale
# (solo i due worker, tre fasi), ma le risposte arrivano da file scritti a mano.
# Nessun servizio esterno viene contattato.
version: 1
state_root: null

services:
  scripted:
    adapter: scripted
    script_dir: "rehearsal/ricerca-collaudo"   # relativo a questo file
    search:
      # Dichiarata cosi' perche' la prova possa percorrere il ramo "la ricerca c'e'".
      # ATTENZIONE, e non e' un dettaglio: l'adattatore scriptato NON impone e NON
      # verifica nessuna modalita' -- lo fa solo l'adattatore web. Questa prova collauda
      # il motore, il contratto, la scelta delle piste, il dossier e il rapporto; non
      # collauda l'accensione dell'interruttore di ricerca su un'interfaccia vera.
      mode: ricerca_simulata

roles:
  solver_a: scripted
  solver_b: scripted

routes:
  scientific_research:
    solve: [solver_a, solver_b]
default_route: scientific_research

limits:
  # I limiti del ciclo di debug restano quelli che governano canale e assenze; il budget
  # della campagna di ricerca sta nel blocco `research:` dell'incarico.
  max_rounds: 3
  transport_retries: 0
  absence_tolerance: 2
  max_wall_clock_minutes: 20

research:
  budget:
    max_phases: 3
    max_main_responses: 6
    max_repairs_per_response: 1
    max_leads: 2
    max_total_interactions: 12
    max_wall_clock_minutes: 20

planning:
  approval: auto
  checkpoint_every: 0

outbound:
  allowed_roots: []

execution:
  model_code: quarantine
