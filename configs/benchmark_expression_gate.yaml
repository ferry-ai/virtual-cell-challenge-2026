# Gate di espressione: una regola scritta a mano, messa alla prova con il protocollo
# a tre contesti. Numeri qui sono il protocollo, non risultati.
#
# Scritto il 2026-09-16 PRIMA di qualunque run con il gate. Nessun numero di questo
# esperimento esisteva quando la regola di decisione qui sotto e' stata fissata.
#
# Perche' esiste. CP-0013 ha misurato che i bracci che provano a IMPARARE la
# dipendenza dal contesto non generalizzano: il descrittore fa una differenza reale
# (45 confronti su 48 con IC95 senza zero, reports/benchmark_3ctx_2026-09-14/
# summary_m004_con_confronti_contesto.json) ma il segno cambia con il contesto
# tenuto fuori. Qui la dipendenza dal contesto non si impara: si scrive come regola
# e si legge dai controlli del contesto di destinazione, che il compito concede.
#
# L'idea in una frase: un gene che nel contesto di destinazione non e' acceso non
# puo' essere spento di piu', quindi la risposta prevista su quel gene va compressa
# verso zero. Con un peso GRADUALE, mai una soglia.
#
# Un solo fattore varia. Ogni braccio gate e' `shrunk_transfer` cosi' come e' stato
# selezionato e calibrato nello stesso split -- stesso alpha, stesso prior_sd --
# moltiplicato per un peso. Il gate non ricalibra l'ampiezza: se lo facesse, la
# differenza con ShrunkTransfer mescolerebbe due cose.
#
# Solo il protocollo a bersaglio gia' visto. Sul bersaglio mai visto ShrunkTransfer
# prevede esattamente il nullo (copertura zero, CP-0013 §5.2), e un gate che
# moltiplica zero non misura niente.
#
# Limiti dichiarati PRIMA di misurare, perche' limitano l'aspettativa:
#
# 1. Lo scorer ufficiale scarta gia' i geni sotto 5 CPM
#    (filter_gene_min_cpm_cell: 5.0 in reports/scorer_2026-09-12/vcc2026_contract.json).
#    Sulla gara il gate lavorerebbe soprattutto su geni ben espressi: il margine e'
#    piu' stretto di quanto l'idea suggerisca.
# 2. In QUESTO banco l'universo genico e' l'intersezione dei geni misurati da tre
#    pannelli (K562, RPE1, HepG2), 6.477 su 18.533 in m002. Ipotesi, non verificata
#    qui: quei pannelli escludono gia' i geni poco espressi (il suffisso `_01` dei
#    file Replogle), quindi i geni davvero spenti sono in gran parte fuori
#    dall'universo e il gate ha ancora meno spazio. Il run registra per ogni split la
#    distribuzione dei CPM dei controlli sull'universo, cosi' l'ipotesi diventa una
#    misura.
# 3. I profili basali di contesti diversi sono molto simili fra loro gene per gene.
#    Ci si aspetta quindi che il gate costruito sulla sorgente (C2) somigli a quello
#    costruito sulla destinazione: la regola chiede una differenza MISURABILE, non
#    la presume.
# 4. G3 agisce sui bersagli poco espressi nel contesto di destinazione. Qui i
#    bersagli sono 160 estratti fra quelli condivisi dai tre contesti: quanti ne
#    tocchi va misurato, non assunto.
#
# Se l'effetto misurato sara' piccolo, era prevedibile: non va presentato come una
# sorpresa ne' come un fallimento.

version: "1"
updated: "2026-09-16"
run_id: x001

primary_metric: pooled_mse_vs_null
primary_metric_direction: lower_is_better
primary_metric_space: "pseudobulk log2FC proxy; not a VCC score"
non_inferiority_margin: null
non_inferiority_note: >-
  Not set, as in m001-m004 and g002. The decision rule below is a directional
  comparison with paired intervals, not a non-inferiority claim.

decision_rule:
  fixed_before_the_run: true
  written: "2026-09-16"
  owner_confirmed: false
  owner_confirmation_note: >-
    Proposed in the brief for this work as "da confermare con il proprietario".
    Not confirmed before the run. Changing it after the numbers exist would make
    it a post-hoc rule, and the checkpoint has to say so if that happens.
  protocol: new_context_seen_target
  statistic: diff
  statistic_note: >-
    `diff` is paired_difference on per-target mse_vs_null: the mean over test
    targets of (arm a - arm b), bootstrap over targets, n_boot and seed as in
    `evaluation`. It is the "differenza appaiata per bersaglio" of CP-0013.
    `diff_paired_pooled` is recorded beside it and does not decide anything.
  unit: every fold and every seed
  unit_note: >-
    Three folds x two development seeds = six splits per comparison. A fold passes
    a clause only if both seeds do. On this protocol the two seeds share the test
    targets and differ in the inner validation targets, i.e. in what the gate
    parameters were selected on.
  missing_or_skipped_comparison: fails_the_clause
  variants: [gate_G1, gate_G2, gate_G3]
  # {V} is each variant in turn. A variant is promoted to candidate only if every
  # clause holds on every split.
  clauses:
    - id: beats_shrunk_transfer
      a: "{V}"
      b: shrunk_transfer
      require: negative_ci_excludes_zero
      text: >-
        On the held-out context's targets, V beats ShrunkTransfer on the paired
        per-target difference in ALL THREE folds, with IC95 excluding zero.
    - id: permuted_does_not_beat
      a: "{V}_perm"
      b: "{V}"
      require: not_negative_ci_excludes_zero
      text: "The permuted gate (C1) does not beat V."
    - id: source_measurably_worse
      a: "{V}_src"
      b: "{V}"
      require: positive_ci_excludes_zero
      text: >-
        The gate built on the source contexts (C2) does measurably worse than the
        one built on the destination: positive difference, IC95 excluding zero,
        in every fold.
  # Evaluated and reported, never used to promote or demote. Written here so that
  # the reading of C1 is fixed before the numbers, not chosen after them.
  reading_clauses:
    - id: permuted_measurably_worse
      a: "{V}_perm"
      b: "{V}"
      require: positive_ci_excludes_zero
      text: >-
        If this does NOT hold on every split, the report must say that the gain,
        if any, is not attributable to the gene-context link but to a global
        compression -- even when the three clauses above promote the variant. The
        brief states it: "se il permutato va come quello vero, il guadagno non
        viene dal legame gene-contesto".
    - id: asymmetric_beats_symmetric
      a: gate_G2
      b: gate_G1
      require: negative_ci_excludes_zero
      text: >-
        If G2 beats G1 on every split, that is biological information (an absent
        gene cannot go down but can go up), not only a numerical one.
  if_not_promoted: >-
    Registered as not adopted, and the result is kept.
  promoted_means: >-
    Candidate for a confirmation run on the reserved seed 4242
    (configs/eval_protocol.yaml, D-032). Not adoption, not a submission, not a
    winner.
  identity_selected_note: >-
    The grid contains the identity gate (constant weight 1). If the internal
    selection picks it, the arm IS shrunk_transfer on that split, the paired
    difference is exactly zero, and the first clause fails there. That is a
    result and is recorded as such.
  do_not_conclude: >-
    Nothing about the six VCC metrics, nothing about the 300-target panel (0/300
    in HepG2), and nothing about A/B/C. No gate parameter is chosen on a test
    context.

expression_gate:
  base_arm: shrunk_transfer
  base_note: >-
    The only arm below the null in all three folds of CP-0013. The gate reuses its
    selected alpha and prior_sd on the same split; the run checks that the base it
    refits scores exactly like the shrunk_transfer row, and stops if not.
  presence:
    quantity: pooled_control_cpm
    reader: >-
      No new reader. Benchmark contexts: the ControlProfile already loaded by the
      runner (extract_control_profile for pseudobulk sources,
      scripts/55_control_profile.py for nadig_hepg2). Official contexts, when
      needed: inference.read_basal_profile.
    log10_pseudocount_cpm: 0.01
    unmeasured_gene_weight: 1.0
    unmeasured_note: >-
      A gene the profile does not measure gets weight 1: missing evidence is not
      evidence of absence (D-009), and the gate does not act without evidence.
  weight:
    form: logistic_in_log10_cpm
    formula: "w = 1 / (1 + exp(-slope * (log10(cpm + pseudocount) - log10(midpoint))))"
    note: >-
      Continuous: about 0 where the gene is absent, about 1 where it is clearly
      expressed, exactly 0.5 at the midpoint. At slope 2 the weight is 0.12 one
      decade below the midpoint and 0.88 one decade above; at slope 4, 0.018 and
      0.982. No switch.
  grid:
    midpoint_cpm: [1.0, 3.0, 10.0, 30.0, 100.0]
    slope_per_decade: [2.0, 4.0]
    positive_attenuation: [0.0, 0.5]
    include_identity: true
    grid_note: >-
      Fixed without looking at any response or any presence distribution. 1 CPM is
      roughly where a gene enters a Replogle panel, 5 CPM is the scorer's filter,
      100 CPM is a mid-to-high expressed gene. positive_attenuation is G2's second
      parameter: the positive part of the delta is multiplied by
      1 - beta * (1 - w), so beta = 0 leaves it intact and beta = 1 would be G1.
  selection:
    pair: internal_cross_context_within_training
    pair_note: >-
      The same pair ShrunkTransfer calibrates on: donor = training contexts other
      than internal_dest_context, destination = internal_dest_context. The
      destination gate reads the internal destination's controls, the source gate
      the donors'. The test context is not read during selection.
    targets: inner_validation_targets_of_the_base_selection
    genes: fold_gene_universe
    loss: mean_squared_error
    tie_break: identity_first_then_strict_improvement
    fallback: >-
      If the base amplitude was predetermined (internal pair too small) or fewer
      than 3 validation targets exist, the gate is the identity and the row says why.
  permutation:
    seed: 20260916
    output_gene_gates: >-
      Presence values shuffled among the genes of the fold universe, once, with the
      seed; the same map at selection and at test. Shuffling inside the scored genes
      keeps the distribution of weights on those genes identical to the real gate,
      so C1 differs from the real gate by the gene-context link alone.
    target_gate: >-
      Target presence values shuffled among the fold's targets, with the same seed.
  source_presence:
    rule: mean_log10_cpm_over_source_contexts_equal_weight
    note: >-
      At test the prediction comes from all training contexts combined with equal
      weight per context (context_equal_weights), so the source presence is the
      equal-weight mean of their log10 CPM. At selection the source is the donor
      side of the internal pair. The source gate never reads the query context.
  variants:
    G1:
      kind: output_symmetric
      note: "Every gene's predicted delta times its weight."
    G2:
      kind: output_asymmetric
      note: >-
        Kept separate from G1: the biologically more defensible variant. An absent
        gene cannot go DOWN but can go UP: the weight applies to the negative part
        of the delta; the positive part is left intact or attenuated by beta.
    G3:
      kind: target
      note: >-
        If the TARGET gene is not expressed in the destination, knocking it down
        cannot do much: the whole predicted response for that target is multiplied
        by the target's weight.
  arms:
    - {name: gate_G1, variant: G1, presence_from: destination, permuted: false}
    - {name: gate_G1_perm, variant: G1, presence_from: destination, permuted: true}
    - {name: gate_G1_src, variant: G1, presence_from: source, permuted: false}
    - {name: gate_G2, variant: G2, presence_from: destination, permuted: false}
    - {name: gate_G2_perm, variant: G2, presence_from: destination, permuted: true}
    - {name: gate_G2_src, variant: G2, presence_from: source, permuted: false}
    - {name: gate_G3, variant: G3, presence_from: destination, permuted: false}
    - {name: gate_G3_perm, variant: G3, presence_from: destination, permuted: true}
    - {name: gate_G3_src, variant: G3, presence_from: source, permuted: false}
  controls_note: >-
    The brief asks for C1 and C2 on "the best variant". Choosing the best variant
    needs numbers, so every variant gets both controls instead, and nothing is
    chosen after the fact.

# The comparisons the decision rule needs, named here and not inferred. Every arm is
# also compared with shrunk_transfer automatically by the runner.
paired_comparisons:
  - {a: gate_G1_perm, b: gate_G1, label: C1_permuted_vs_real}
  - {a: gate_G1_src, b: gate_G1, label: C2_source_vs_destination}
  - {a: gate_G2_perm, b: gate_G2, label: C1_permuted_vs_real}
  - {a: gate_G2_src, b: gate_G2, label: C2_source_vs_destination}
  - {a: gate_G3_perm, b: gate_G3, label: C1_permuted_vs_real}
  - {a: gate_G3_src, b: gate_G3, label: C2_source_vs_destination}
  - {a: gate_G2, b: gate_G1, label: asymmetric_vs_symmetric}

gene_universe: intersection_measured
zero_fill_missing: false
zero_fill_note: >-
  Unmeasured genes are excluded from the universe, not filled with zero (D-009).

signatures:
  dirs: null            # set on the command line: --signatures <e001> <e003>
  sources: [k562_gwps, rpe1_essential, nadig_hepg2]
  shared_targets_from: [k562_gwps, rpe1_essential, nadig_hepg2]
  min_cells_already_applied: 10

directions:
  - id: k562_rpe1_to_hepg2
    train_context: "K562+RPE1"
    test_context: HepG2
    train_sources: [k562_gwps, rpe1_essential]
    test_source: nadig_hepg2
    internal_dest_source: rpe1_essential
    internal_dest_context: RPE1
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same fold as m002, unchanged."
  - id: k562_hepg2_to_rpe1
    train_context: "K562+HepG2"
    test_context: RPE1
    train_sources: [k562_gwps, nadig_hepg2]
    test_source: rpe1_essential
    internal_dest_source: nadig_hepg2
    internal_dest_context: HepG2
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same fold as m002, unchanged."
  - id: rpe1_hepg2_to_k562
    train_context: "RPE1+HepG2"
    test_context: K562
    train_sources: [rpe1_essential, nadig_hepg2]
    test_source: k562_gwps
    internal_dest_source: nadig_hepg2
    internal_dest_context: HepG2
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same fold as m002, unchanged."

protocols:
  - new_context_seen_target
unseen_fraction: 0.3
inner_val_fraction: 0.2

pilot:
  max_targets: 160
  max_targets_note: >-
    Same cap and same rule as m002, so the nine original arms of this run can be
    checked row by row against m002: uniform random subset of the shared targets,
    seed-controlled, never filtered by effect size (D-011).
  seeds: [2026, 2027]
  seeds_note: >-
    Development seeds (configs/eval_protocol.yaml). The confirmation seed 4242 is
    reserved and is not opened by this run.
  collapse_guides: true

amplitude:
  predetermined_alpha: 1.0
  forbidden_trial_alpha: 0.1974
  with_internal_pair: closed_form_least_squares
  without_internal_pair: predetermined
  predetermined_label: predetermined_heuristic
  never_call_predetermined_cross_context: true

descriptors:
  n_high_expr_genes: 32
  include_train_response_codes: true
  ntc_of_query_context: allowed_declared_shared_across_arms
  response_derived_features_forbidden_for_unseen_targets: true
  high_expr_selection: mean_of_training_contexts
  control_profiles:
    nadig_hepg2: "<data_root>/artifacts/e003/signatures/nadig_hepg2.control_profile.npz"

models:
  shrunk_transfer:
    prior_sd_grid: [0.5, 1.0, 4.0, 1000000.0]
    multi_source_rule: context_equal_weights
  lowrank_linear:
    rank_grid: [8, 16]
    ridge_grid: [1.0, 10.0]
  compact_mlp:
    hidden: 24
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
  modular:
    rank_grid: [8, 16]
    hidden: 8
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
    joint_finetune_epochs: 12
    joint_lr: 0.003

evaluation:
  n_boot: 200
  strong_threshold: 0.5
  score_unobserved_as: zero_delta_with_coverage_reported
  save_full_predictions: false

generator_x_predictor:
  execute_six_metrics: false
  reason: "separate experiment; see docs/BENCHMARK_TRE_CONTESTI.md section 5.6"
