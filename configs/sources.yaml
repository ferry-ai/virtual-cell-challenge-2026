# Source registry — VCC 2026
#
# Every number here is copied from a file in reports/, named in `evidence`.
# Nothing is entered from a document's prose. If a field is unknown it is null;
# an absent check is never recorded as a passed one.
#
# `verification` is one of: declared, metadata_verified, schema_verified,
# sample_verified, pilot_ingested, usable. See src/vcc2026/registry.py for what
# each level asserts. `enabled` means the pipeline may read it; a source below
# sample_verified may not be enabled, and the loader enforces that.
#
# Coverage is three separate fields on purpose:
#   library_targets   — panel targets in the guide library DESIGN
#   observed_targets  — panel targets with >=1 usable cell observed
#   targets_min_cells — panel targets with >= min_cells cells
# These are different quantities. Reporting the first as if it were the third
# is the specific error this schema exists to prevent.

version: "1"
updated: "2026-09-12"

