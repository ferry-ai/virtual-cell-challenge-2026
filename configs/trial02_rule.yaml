# How trial-02's predictor amplitudes are chosen. Written 2026-09-17 ~17:45 (Europe/Rome),
# BEFORE any result of benches b002 (stage 73) and h002 (stage 75) existed.
# owner_confirmed: false -- the owner has not reviewed this rule (same situation as CP-0017).
version: 2
owner_confirmed: false
written_before_results: true
inputs:
  primary: MyDrive/vcc2026/runs/bench_hepg2_2026-09-17/h002/bench.json   # K562 -> HepG2, new context
  sanity: MyDrive/vcc2026/runs/bench_k562_2026-09-17/b002/bench.json     # K562 panel, in context
candidates: arms of h002 that use the new generator (no "g0:" prefix) and are not null_new
rule:
  - pick the candidate with the highest scaled_local.avg in h002
  - guard_calls: its sig/t must be >= 0.5 x the replicate's sig/t in h002, or its scaled FID >= -0.2
  - guard_nmae: its scaled NMAE must be >= (scaled NMAE of "g0:rawtransfer_a0.2") - 0.10
  - tie_break: within 0.02 of the best avg, prefer the arm with cismeas and cis terms, then the smaller transfer amplitude
  - stop: if no candidate beats "g0:rawtransfer_a0.2" (trial-01's recipe on HepG2) on scaled_local.avg, trial-02 is NOT generated; the hypothesis "new generator + cis beats trial-01" is recorded as contradicted
  - sanity: if b002 shows oracle_a2.0 below oracle_a1.0 on avg, the transfer amplitude is capped at 1.0 (cross-context signal is weaker than in-context)
mapping_to_stage_76:
  transfer_aX: "--a-transfer X"
  rawtransfer_aX: "--a-transfer X --use-raw"
  cismeas_aY: "--a-cis-measured Y"
  cis_aZ: "--a-cis Z"
  shared_aW: "--a-shared W"
not_a_score: the local scale of the benches is not the leaderboard scale; the submission is the only measurement on A/B/C
revisions:
  - version: 2
    when: 2026-09-17 ~18:00, still before any result of b002 or h002
    what: guard_nmae made relative to trial-01's recipe on the same bench (was an absolute -0.10)
    why: >-
      a dry run of stage 81 on a 4-target local fixture (fake K562 statistics, not a result)
      showed every HepG2 arm far below the baseline on NMAE, because HepG2's context mean
      carries the strong shared response of essential-gene knockdowns that no arm reproduces.
      An absolute guard would stop trial-02 for a property of HepG2, not of the arm.
deviations:
  - when: 2026-09-17 ~19:28, after both benches
    what: a second candidate, t03, generated WITHOUT the K562 sanity cap (transfer 2.0); t02 keeps the rule's mechanical outcome (transfer 1.0)
    why: see reports/trial02_decision_2026-09-17/deviation_t03.json (the cap was triggered by a Jaccard convention that dominates only at K562's median of 3 significant genes)
