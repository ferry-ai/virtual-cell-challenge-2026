# Rank of the response basis: 16 vs 32 vs 64 vs 128, selected on inner val.
#
# Runs after the exact-vs-randomized substitution has been scored. s002 did
# not meet the pre-specified compatibility band on every fold (D-029 check),
# so this rank comparison uses the exact SVD: the question is rank, not the
# sketch. Rank is chosen on the internal split of each fold, never on the
# held-out context. GO slim stays off. Descriptors, loss, ridge grid, MLP
# budget and generator are those of m002.
#
# Rank that explains more training variance is not, by itself, the rank that
# predicts a new context.

version: "1"
updated: "2026-09-15"
run_id: r001

primary_metric: pooled_mse_vs_null
primary_metric_direction: lower_is_better
primary_metric_space: "pseudobulk log2FC proxy; not a VCC score"
non_inferiority_margin: null
non_inferiority_note: >-
  Not set. A rank is reported as selected on inner validation; it is not
  adopted as the project default from a single fold.

factorization:
  method: exact
  n_oversamples: 10
  n_iter: 2
  seed: null
  why_exact: >-
    Randomized failed the pre-specified s001/s002 band on 4 of 48 folds,
    all modular_frozen with context. Using exact keeps the rank question
    unconfounded with the sketch. See reports/svd_2026-09-15/.

gene_universe: intersection_measured
zero_fill_missing: false

signatures:
  dirs: null
  sources: [k562_gwps, rpe1_essential, nadig_hepg2]
  shared_targets_from: [k562_gwps, rpe1_essential, nadig_hepg2]
  min_cells_already_applied: 10

directions:
  - id: k562_rpe1_to_hepg2
    train_context: "K562+RPE1"
    test_context: HepG2
    train_sources: [k562_gwps, rpe1_essential]
    test_source: nadig_hepg2
    internal_dest_source: rpe1_essential
    internal_dest_context: RPE1
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same folds as m002."
  - id: k562_hepg2_to_rpe1
    train_context: "K562+HepG2"
    test_context: RPE1
    train_sources: [k562_gwps, nadig_hepg2]
    test_source: rpe1_essential
    internal_dest_source: nadig_hepg2
    internal_dest_context: HepG2
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same folds as m002."
  - id: rpe1_hepg2_to_k562
    train_context: "RPE1+HepG2"
    test_context: K562
    train_sources: [rpe1_essential, nadig_hepg2]
    test_source: k562_gwps
    internal_dest_source: nadig_hepg2
    internal_dest_context: HepG2
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same folds as m002."

protocols:
  - new_context_seen_target
  - new_context_unseen_target
unseen_fraction: 0.3
inner_val_fraction: 0.2

pilot:
  max_targets: 160
  max_targets_note: >-
    Same cap as m002 so the rank comparison is readable against that run.
    Expand only if the 160-target pilot's RAM and wall time leave room.
  seeds: [2026]
  collapse_guides: true

amplitude:
  predetermined_alpha: 1.0
  forbidden_trial_alpha: 0.1974
  with_internal_pair: closed_form_least_squares
  without_internal_pair: predetermined
  predetermined_label: predetermined_heuristic
  never_call_predetermined_cross_context: true

descriptors:
  n_high_expr_genes: 32
  include_train_response_codes: true
  ntc_of_query_context: allowed_declared_shared_across_arms
  response_derived_features_forbidden_for_unseen_targets: true
  high_expr_selection: mean_of_training_contexts
  control_profiles:
    nadig_hepg2: "<data_root>/artifacts/e003/signatures/nadig_hepg2.control_profile.npz"

descriptor_variants:
  with_ctx:
    include_context: true
    include_go_slim: false
    note: "basal + context; GO slim stays off (D-028)"
  no_ctx:
    include_context: false
    include_go_slim: false
    note: "basal only"

arms:
  - {model: lowrank_linear, variant: with_ctx}
  - {model: lowrank_linear, variant: no_ctx}
  - {model: modular_frozen, variant: with_ctx}
  - {model: modular_frozen, variant: no_ctx}

paired_comparisons:
  - {a: lowrank_linear__with_ctx, b: lowrank_linear__no_ctx, label: context_descriptor_vs_none}
  - {a: modular_frozen__with_ctx, b: modular_frozen__no_ctx, label: context_descriptor_vs_none}
  - {a: modular_frozen__with_ctx, b: lowrank_linear__with_ctx, label: frozen_vs_lowrank}

models:
  shrunk_transfer:
    prior_sd_grid: [0.5, 1.0, 4.0, 1000000.0]
    multi_source_rule: context_equal_weights
  lowrank_linear:
    rank_grid: [16, 32, 64, 128]
    ridge_grid: [1.0, 10.0]
  compact_mlp:
    hidden: 24
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
  modular:
    rank_grid: [16, 32, 64, 128]
    hidden: 8
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
    joint_finetune_epochs: 12
    joint_lr: 0.003

evaluation:
  n_boot: 200
  strong_threshold: 0.5
  score_unobserved_as: zero_delta_with_coverage_reported
  save_full_predictions: false

generator_x_predictor:
  execute_six_metrics: false
  reason: "not this experiment; generator and scorer stay untouched"
