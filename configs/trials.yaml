# Trial definitions — VCC 2026
#
# A trial is one submission-shaped run of stage 45: a prediction rule, the data
# it is allowed to read, the seed it draws with, and what it is for. One trial is
# left, trial-ext-profile: the trial-01 generator driven by the per-context
# effects files of stage 100. trial-00-controls and trial-01-transfer, defined on
# 12 September, left this file with their code on 24 September 2026 (D-043, tag
# archivio/pre-pulizia-2026-09-24).
#
# Nothing here is a score. The diagnostics stage 45 writes are local measures,
# not VCC scores; the official scores are in the checkpoints.

version: "1"
updated: "2026-09-24"

defaults:
  contexts: ["A", "B", "C"]
  cells_per_pert: 400
  seed: 20260912
  # The per-cell storage budget is the global cap divided by the full 360,000
  # cells, so a pilot uses the same per-cell budget as a full submission and a
  # pilot that fits does not mislead about the full run.
  overdispersion: null

trials:

  - id: trial-ext-profile
    title: "trial-01's generator driven by per-context effects from a file"
    kind: external_effects
    trains: false
    description: >-
      The trial-01 generation path unchanged -- basal profile of each context,
      compositional shift on the supported genes, Poisson counts at library sizes
      resampled from that context's controls -- with the effects read from
      per-context npz files (stage 100: targets, genes, lfc in ln units, observed
      mask) instead of the K562 ShrunkTransfer. Holding the generator fixed is the
      point: a score difference against trial-01 is then a difference of effects.
    rules:
      - "Effects are passed with --effects CTX=PATH for every generated context."
      - "A pair the file marks unobserved keeps its exact share of the composition
         (D-009), exactly as a gene outside the source universe did in trial-01."
