# Keep or discard the RPE1 common component. Written 2026-09-18 15:21 (Europe/Rome), BEFORE
# jobs 024-027 were queued. The owner chose the design in chat the same afternoon: two benches,
# weight chosen on one set of targets and the verdict on a disjoint one, KEEP only if BOTH
# benches say keep. The metrics, the permuted control and the thresholds are the agent's.
# Applied mechanically by scripts/91_common_component_verdict.py.
version: 1
owner_confirmed: false
written_before_results: true

question: >-
  Does adding w x (the response RPE1's knockdowns share) to a prediction improve it, with w
  chosen on targets that are not the ones judged? Verdict: KEEP or DISCARD, nothing else.

grid: [0.1, 0.25, 0.5, 1.0, 2.0]

benches:
  hepg2:
    why: the submitted recipe (t03) on a context K562 never saw; targets are essential genes
    base_arm: "transfer_a2.0+cismeas_a1.0+cis_a1.0"      # exactly t03's recipe, K562 single-cell source
    variant_arm: "transfer_a2.0+cismeas_a1.0+cis_a1.0+common_a{w}"
    control_arm: "transfer_a2.0+cismeas_a1.0+cis_a1.0+permcommon_a{w}"
    tune: MyDrive/vcc2026/runs/common_2026-09-18/hepg2_tune/        # targets: panel/hepg2_tune_targets.txt (300)
    eval: MyDrive/vcc2026/runs/common_2026-09-18/hepg2_eval/        # 300 drawn from panel/hepg2_eval_pool.txt (759)
    metric: >-
      stage-84 predicted official mean: per member, bench raw x (t03 official raw / base-arm
      bench raw), scaled with reports/anchors_2026-09-17/anchors.json; mse counted as 0 as in
      stage 84. Calibration: base arm <-> t03 (entry 0TbVAwhVTj6UYpaU2v9d), re-read on each
      bench, so the base arm predicts t03's own score by construction.
  k562_official:
    why: the official targets themselves (K562, 133 + 133 of the 266 with >= 40 cells)
    base_arm: "null_new"
    variant_arm: "common_a{w}"
    control_arm: "permcommon_a{w}"
    tune: MyDrive/vcc2026/runs/common_2026-09-18/k562_tune/         # targets: panel/k562_tune_targets.txt
    eval: MyDrive/vcc2026/runs/common_2026-09-18/k562_eval/         # targets: panel/k562_eval_targets.txt
    metric: >-
      the bench's local scaled mean (`scaled_local.avg`: the bench's own baseline and replica,
      mse clipped to [0, 1]); no submitted configuration exists on this bench to calibrate to.

procedure:
  - >-
    Tune, per bench: w* = the w in {0} U grid maximising the metric of variant_arm(w) on the
    tune bench, with w = 0 meaning base_arm; ties go to the smaller w.
  - >-
    Eval, per bench, at that w* only: d_base = metric(variant(w*)) - metric(base) and
    d_perm = metric(variant(w*)) - metric(control(w*)). The other grid points are reported,
    never used for the verdict.
  - >-
    A bench PASSES if w* > 0, d_base >= min_gain and d_perm >= min_gain. d_perm is there
    because adding any vector adds calls, and on these benches calls alone raise the
    direction metrics (CP-0021, and a null base calls nothing): the component must beat
    its own values on the wrong genes, not only the recipe without it.
  - >-
    KEEP if both benches pass; the weight carried to a submission is then min(w*_hepg2,
    w*_k562_official). Otherwise DISCARD.

min_gain: 0.01   # a rule of thumb, not a measure of uncertainty

validity:
  - every arm the procedure reads exists in its bench
  - tune and eval targets are disjoint within each bench (read from bench.json `targets`)
  - the common term excluded the bench's own targets (bench.json `common_term.n_excluded`)

report_regardless: >-
  every arm's six raw members, sig/t and per-target components; d_base and d_perm at every w
  on the eval benches, marked as not decisive.

what_this_cannot_settle: >-
  HepG2 targets are essential genes, whose knockdowns share far more response than the
  official ones (K562: shared-response RMS 0.026 against 0.003, measured 2026-09-18). The
  K562 bench has the official targets but in a TP53-null line and without the t03 recipe.
  KEEP says the component is worth one submission; only the leaderboard says it helps there.
