# Frozen evaluation protocol. Numbers here are rules, not results.
#
# Written 2026-09-15 before new confirmation scores. The 14–15 September
# folds (m001–m004, g001–g002, s001–s002, r001, generator×predictor on
# HepG2) have been consulted and are development. A new seed on K562/RPE1/
# HepG2 is not an independent biological replicate.
#
# Six raw metrics are never averaged. Official mean-perturbation baselines
# use query-context ground truth: they are local anchors, not predictors.

version: "1"
updated: "2026-09-15"
frozen: true
run_id_prefix: p001

primary_metric_space: >-
  six VCC metrics, raw, when a single-cell bundle with real NTC exists;
  otherwise pseudobulk log2FC proxy, labelled not_a_vcc_score
do_not_average_raw_metrics: true
forbidden_trial_alpha: 0.1974

protocols:
  - new_context_seen_target
  - new_context_unseen_target

unseen_target:
  query_ntc_allowed: true
  query_perturbed_responses_forbidden: true
  guides_of_a_target_stay_together: true
  donors_and_batches_preserved: true
  deduplicate_before_split: true

development:
  seeds: [2026, 2027]
  note: >-
    Already used for model and source choices. Includes the three-context
    folds of 2026-09-14 and the HepG2 generator×predictor experiment.
  previous_runs:
    - m001
    - m002
    - m003
    - m004
    - g001
    - g002
    - s001
    - s002
    - r001

confirmation:
  seed: 4242
  reserved: true
  note: >-
    Not yet used. Do not open this seed until the candidate is frozen.
    Three cell lines still do not support a claim about all tissues.

amplitude:
  calibrate_on: training_and_inner_validation_only
  allowed: [closed_form_least_squares_within_training, predetermined_heuristic]
  forbidden: [0.1974]
  never_reuse_trial_alpha_as_universal_constant: true

comparators:
  diagnostic_null: true
  mean_train_response: true
  shrunk_transfer: true
  one_simple_candidate: true
  official_mean_perturbation_is_anchor_not_predictor: true

generator_x_predictor:
  predictors: [null, shrunk_transfer]
  generators: [current, ntc_anchored]
  paired_targets_and_sampling_seed: true
  null_checks_spurious_de_and_basal_shift: true

anchors:
  local: true
  cells_disjoint_between_replicate_halves: true
  ntc_of_each_half_are_that_halfs_controls: true
  no_tuning_on_test_anchors: true
  if_denominator_unstable: report_raw_metrics_and_uncertainty

bootstrap:
  unit: target
  paired: true
  separate_per_context: true
  n_boot: 200
  seeds_are_not_biological_replicates: true
  three_lines_do_not_support_a_tissue_general_claim: true

promotion:
  requires_confirmation_not_used_for_selection: true
  paired_ci95_of_candidate_minus_baseline_entirely_favourable: true
  harm_beyond_tolerance_blocks_promotion: true
  missing_stable_anchors_or_independent_confirmation: exploratory
  no_invented_leaderboard_target: true

scorer:
  package: cell-eval2
  expected_version: "0.16.0"
  record_backend_beside_every_number: true
  metrics:
    - pds_cosine
    - expr_mse_unbiased_capped_norm
    - de_wilcoxon_lfc_nmae
    - de_wilcoxon_direction_fidelity_yield_raw
    - de_wilcoxon_direction_reach_raw
    - de_wilcoxon_sig_jaccard
