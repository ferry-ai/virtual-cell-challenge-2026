# Pilot GO slim: l'unica estensione dei descrittori proposta da CP-0012.
#
# Domanda, e una sola: per un bersaglio MAI perturbato nel training, un riassunto
# curato della sua funzione (140 termini GO slim) aggiunge qualcosa al solo
# basale? Il protocollo, i criteri e i bracci sono quelli fissati in
# docs/ENCODER_INPUTS.md §6, prima che questo run esistesse.
#
# Perche' il solo protocollo `new_context_unseen_target`: e' li' che vive il modo
# B. Sul protocollo `seen_target` il bersaglio ha gia' le sue risposte di
# training e i codici SVD, e la domanda sarebbe un'altra. ShrunkTransfer non
# compare: sull'unseen ha copertura zero per costruzione, quindi non e' un
# confronto, e' una divisione per niente.
#
# Perche' due decoder e non cinque: si varia UN fattore. Il decoder resta fisso e
# cambiano i descrittori; due decoder servono solo a vedere se la risposta
# dipende dal decoder, non ad aggiungerne altri al confronto.
#
# Costo dichiarato prima: 2 decoder x 4 varianti = 8 bracci, 3 fold x 2 seed =
# 48 righe, contro le 108 di m002. E' un pilot: il tempo e il picco di RAM si
# misurano qui e si decide dopo se ampliare.

version: "1"
updated: "2026-09-15"
run_id: g002

primary_metric: pooled_mse_vs_null
primary_metric_direction: lower_is_better
primary_metric_space: "pseudobulk log2FC proxy; not a VCC score"
non_inferiority_margin: null
non_inferiority_note: >-
  Not set, as in m001 and m002. The decision rule below is a directional
  comparison with a paired interval, not a non-inferiority claim.

decision_rule:
  fixed_before_the_run: true
  source: "docs/ENCODER_INPUTS.md section 6"
  keep_the_slim_if: >-
    on new_context_unseen_target, B1 has a lower pooled_mse_vs_null than B0 with
    a per-target paired bootstrap interval excluding zero in both directions; or
    in one direction with a stable effect across the two seeds and not worse in
    the other.
  discard_the_slim_if: >-
    B1 does not beat B0, or B3 is indistinguishable from B1 -- a permuted
    annotation of the same sparsity would then explain the whole difference.
  do_not_conclude: >-
    nothing about the VCC panel, nothing about the six metrics, and no feature
    selection on the held-out context.

gene_universe: intersection_measured
zero_fill_missing: false

signatures:
  dirs: null            # set on the command line: --signatures <e001> <e003>
  sources: [k562_gwps, rpe1_essential, nadig_hepg2]
  shared_targets_from: [k562_gwps, rpe1_essential, nadig_hepg2]
  min_cells_already_applied: 10

directions:
  - id: k562_rpe1_to_hepg2
    train_context: "K562+RPE1"
    test_context: HepG2
    train_sources: [k562_gwps, rpe1_essential]
    test_source: nadig_hepg2
    internal_dest_source: rpe1_essential
    internal_dest_context: RPE1
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same folds as m002, unchanged."
  - id: k562_hepg2_to_rpe1
    train_context: "K562+HepG2"
    test_context: RPE1
    train_sources: [k562_gwps, nadig_hepg2]
    test_source: rpe1_essential
    internal_dest_source: nadig_hepg2
    internal_dest_context: HepG2
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same folds as m002, unchanged."
  - id: rpe1_hepg2_to_k562
    train_context: "RPE1+HepG2"
    test_context: K562
    train_sources: [rpe1_essential, nadig_hepg2]
    test_source: k562_gwps
    internal_dest_source: nadig_hepg2
    internal_dest_context: HepG2
    n_train_contexts: 2
    context_dependence_identifiable: true
    note: "Same folds as m002, unchanged."

protocols:
  - new_context_unseen_target
unseen_fraction: 0.3
inner_val_fraction: 0.2

pilot:
  max_targets: 160
  max_targets_note: >-
    Same cap and same rule as m002 so the two runs are comparable: uniform random
    subset of the shared targets, seed-controlled, never filtered by effect size.
  seeds: [2026, 2027]
  collapse_guides: true

amplitude:
  predetermined_alpha: 1.0
  forbidden_trial_alpha: 0.1974
  with_internal_pair: closed_form_least_squares
  without_internal_pair: predetermined
  predetermined_label: predetermined_heuristic
  never_call_predetermined_cross_context: true

descriptors:
  n_high_expr_genes: 32
  include_train_response_codes: true     # only ever applied on seen_target, absent here
  ntc_of_query_context: allowed_declared_shared_across_arms
  response_derived_features_forbidden_for_unseen_targets: true
  high_expr_selection: mean_of_training_contexts
  control_profiles:
    nadig_hepg2: "<data_root>/artifacts/e003/signatures/nadig_hepg2.control_profile.npz"
  go_slim_table: "<data_root>/artifacts/g001/go_slim_table.npz"
  go_slim_provenance: >-
    scripts/58_build_go_slim_table.py; HGNC -> UniProt -> GAF (NOT dropped) ->
    ancestral closure over is_a/part_of -> goslim_generic. 2,693 symbols, 140
    terms, 46 without any slim bit. Reproduces the independent probe of
    2026-09-14 on the panel exactly: the same 5 of 300 genes lack a slim bit.

# The four labels of docs/ENCODER_INPUTS.md section 6, unchanged.
descriptor_variants:
  B0:
    include_context: true
    include_go_slim: false
    note: "reference: basal + z_c, the current mode-B state"
  B1:
    include_context: true
    include_go_slim: true
    note: "B0 + GO slim: the value of the annotation"
  B2:
    include_context: false
    include_go_slim: true
    note: "B1 without z_c: do the query NTCs earn their place on new targets?"
  B3:
    include_context: true
    include_go_slim: true
    permute_go_slim: true
    permutation_seed: 20260915
    note: >-
      B1 with the slim rows shuffled among symbols, one permutation fixed by the
      seed and applied identically at fit and at inference. If B3 matches B1, the
      gene-to-annotation link explains nothing and 140 columns of the same
      sparsity explain everything.

arms:
  - {model: lowrank_linear, variant: B0}
  - {model: lowrank_linear, variant: B1}
  - {model: lowrank_linear, variant: B2}
  - {model: lowrank_linear, variant: B3}
  - {model: modular_frozen, variant: B0}
  - {model: modular_frozen, variant: B1}
  - {model: modular_frozen, variant: B2}
  - {model: modular_frozen, variant: B3}

# The comparisons the decision rule needs, named here and not inferred.
paired_comparisons:
  - {a: lowrank_linear__B1, b: lowrank_linear__B0, label: go_slim_vs_basal}
  - {a: lowrank_linear__B3, b: lowrank_linear__B1, label: permuted_go_vs_real_go}
  - {a: lowrank_linear__B2, b: lowrank_linear__B1, label: without_context_vs_with}
  - {a: modular_frozen__B1, b: modular_frozen__B0, label: go_slim_vs_basal}
  - {a: modular_frozen__B3, b: modular_frozen__B1, label: permuted_go_vs_real_go}
  - {a: modular_frozen__B2, b: modular_frozen__B1, label: without_context_vs_with}

models:
  shrunk_transfer:
    prior_sd_grid: [0.5, 1.0, 4.0, 1000000.0]
  lowrank_linear:
    rank_grid: [8, 16]
    ridge_grid: [1.0, 10.0]
  compact_mlp:
    hidden: 24
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
  modular:
    rank_grid: [8, 16]
    hidden: 8
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
    joint_finetune_epochs: 12
    joint_lr: 0.003

evaluation:
  n_boot: 200
  strong_threshold: 0.5
  score_unobserved_as: zero_delta_with_coverage_reported
  save_full_predictions: false

generator_x_predictor:
  execute_six_metrics: false
  reason: "separate experiment; see docs/BENCHMARK_TRE_CONTESTI.md section 5.6"
