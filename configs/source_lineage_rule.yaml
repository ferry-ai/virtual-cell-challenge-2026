# How the RPE1-vs-K562 transfer comparison is read. Written 2026-09-18 ~00:15 (Europe/Rome),
# BEFORE jobs 018 and 019 had produced any output (queued 2026-09-17 ~23:57, dispatcher idle).
# owner_confirmed: false -- the owner set the question and the pass/fail direction in the
# morning brief; the thresholds below are the agent's, not reviewed.
# 2026-09-18 ~13:00 (Rome), jobs 020/021 running, no output yet: the owner kept the 0.03
# threshold for reading THIS experiment and narrowed what a verdict means (verdict_scope).
# Metric, arms, threshold and gate are unchanged, so the version is unchanged.
version: 1
owner_confirmed: true
owner_confirmed_on: "2026-09-18, in chat, before any result existed"
written_before_results: true
verdict_scope: >-
  0.03 is a rule of thumb, not a measure of uncertainty, and the three amplitudes read the
  same data (they are not three independent replicates). A WINS verdict warrants follow-up
  (target-specific vs common response), not adoption of a source strategy; INCONCLUSIVE or a
  K562 win does not declare cross-context transfer dead. The bench panel is HepG2's, not the
  competition's: coverage of the official targets is a separate measurement.

question: >-
  Does the lineage of the transfer source explain why K562 signatures do not produce
  directions on the official contexts? If it does, RPE1 (epithelial, like HepG2 in being
  adherent and non-haematopoietic) must transfer onto HepG2 better than K562 (erythroid).

inputs:
  k562: MyDrive/vcc2026/runs/bench_hepg2_source_2026-09-18/s_k562_gwps/bench.json
  rpe1: MyDrive/vcc2026/runs/bench_hepg2_source_2026-09-18/s_rpe1/bench.json
  panel: MyDrive/vcc2026/runs/bench_hepg2_source_2026-09-18/panel/shared_targets.txt

held_equal:
  - both arms read a Replogle *_raw_bulk_01.h5ad through --k562-bulk (same estimator,
    same quasi-Poisson SE model), so the sources differ in lineage and depth, not in code path
  - same --targets-file (1.059 shared symbols), --n-targets 300, --min-cells 50, --seed 2026
  - same HepG2 truth, therefore the same half A / half B split and the same control pool

validity_gate: >-
  The comparison is void unless the two runs agree EXACTLY on the raw values of the
  `replicate` and `baseline` anchors and on the 300 selected targets. Those depend only on
  the HepG2 truth and the seed, so any difference means the panels did not match and the raw
  numbers answer different questions. `null_new` reads no source either and must agree;
  a difference there is an RNG-order bug, not a result.

primary_metric: de_wilcoxon_direction_fidelity_yield_raw   # raw, never the local scaled value
primary_arms: [transfer_a0.5, transfer_a1.0, transfer_a2.0]  # pure transfer: no cis term, so the source is the only input

rule:
  - >-
    RPE1 WINS if its raw fidelity is higher than K562's on ALL THREE primary arms and the
    largest of the three gaps is at least 0.03 (about a fifth of the distance between the
    bench baseline, 0.1187, and the trial-01 recipe, 0.2878).
  - >-
    K562 WINS under the mirror-image condition.
  - >-
    Otherwise the result is INCONCLUSIVE at this panel size, and the hypothesis is neither
    confirmed nor refuted -- which is a reportable outcome, not a reason to run again with
    different settings.
  - >-
    report_regardless: the same comparison on pds_cosine, de_wilcoxon_lfc_nmae,
    de_wilcoxon_direction_reach_raw, de_wilcoxon_sig_jaccard and on
    transfer_a2.0+cismeas_a1.0+cis_a1.0, plus sig/t per arm.

confound_declared_before_the_run:
  measured_by: reports/source_coverage_2026-09-17/c001/coverage.json
  panel_coverage: >-
    RPE1 covers 1.061/1.061 of the eligible HepG2 panel and K562 genome-wide 1.059 --
    coverage is NOT the confound the brief feared, and pinning the panel removes what is left of it.
  depth: >-
    RPE1 has a median 101 filtered cells per covered target against K562's 184, and 11.485
    NTC cells against 75.328. Both enter the standard error in `effects_from_bulk`, so RPE1's
    per-target effects are the noisier of the two. This favours K562.
  gene_space: >-
    RPE1 measures 7.733 of HepG2's 9.624 genes, K562 7.425. This slightly favours RPE1.
  consequence: >-
    If RPE1 wins, the depth confound runs against the result and the conclusion is safe in
    direction. If K562 wins, depth is an alternative explanation to lineage and the result
    does NOT by itself refute the lineage hypothesis -- say so rather than closing it.

what_this_cannot_settle: >-
  HepG2 is not A, B or C. `reports/contexts_2026-09-17/` measures that the three official
  contexts are a T lymphocyte, a keratin-high epithelium and a cohesive epithelium, and that
  neither K562's erythroid markers nor HepG2's hepatocyte markers appear in any of them.
  A source winning on HepG2 is evidence about transfer between two non-official contexts.
