# First modular-vs-monolithic pilot. Numbers here are the protocol, not results.
#
# Primary metric is fixed before any comparison (pooled MSE vs the null, in
# pseudobulk log2FC). That is a proxy, not a VCC score. Non-inferiority is
# not claimed: the margin is left null until baseline repeatability is
# measured independently of this run.

version: "1"
updated: "2026-09-14"
run_id: m001

primary_metric: pooled_mse_vs_null
primary_metric_direction: lower_is_better
primary_metric_space: "pseudobulk log2FC proxy; not a VCC score"
non_inferiority_margin: null
non_inferiority_note: >-
  Not set. Declaring non-inferiority requires a margin fixed from an independent
  measure of baseline repeatability, before the comparison. This pilot reports
  point estimates, paired target differences and seed spread, and says
  inconclusive when intervals overlap.

gene_universe: intersection_measured
zero_fill_missing: false
zero_fill_note: >-
  Unmeasured genes are excluded from the universe, not filled with zero.
  Zero-fill is not a statistically neutral treatment (D-009). Coverage lost
  relative to the official 18,533-gene axis is recorded with the universe.

signatures:
  # Existing e001 signatures, not rebuilt. A new signature run would use a new id.
  dir: null
  sources: [k562_gwps, k562_essential, rpe1_essential]
  min_cells_already_applied: 10

# k562_gwps and k562_essential share a cell line; they are not two biological
# contexts. essential is an internal destination for amplitude when RPE1 is held
# out. That is same-line, limited calibration — not cross-context calibration.
directions:
  - id: k562_to_rpe1
    train_context: K562
    test_context: RPE1
    train_sources: [k562_gwps]
    test_source: rpe1_essential
    internal_dest_source: k562_essential
    internal_dest_context: K562
    n_train_contexts: 1
    context_dependence_identifiable: false
    note: >-
      One training context. Tests transfer feasibility, not general learning of
      context dependence. Internal dest is the same cell line (K562 essential).
  - id: rpe1_to_k562
    train_context: RPE1
    test_context: K562
    train_sources: [rpe1_essential]
    test_source: k562_gwps
    internal_dest_source: null
    internal_dest_context: null
    n_train_contexts: 1
    context_dependence_identifiable: false
    note: >-
      One training context and no internal pair. Amplitude uses the predetermined
      rule, never the trial alpha 0.1974.

protocols:
  - new_context_seen_target
  - new_context_unseen_target
unseen_fraction: 0.3
inner_val_fraction: 0.2

pilot:
  max_targets: 160
  max_targets_note: >-
    Random subset of shared targets, seed-controlled, not filtered by effect
    size (D-011). Sized for an 8 GiB machine that often has <1 GiB free: the
    signature npz still decompresses whole, so the cap limits what we keep
    after the load, not the peak of the load itself.
  seeds: [2026, 2027]
  collapse_guides: true

amplitude:
  predetermined_alpha: 1.0
  forbidden_trial_alpha: 0.1974
  with_internal_pair: closed_form_least_squares
  without_internal_pair: predetermined
  predetermined_label: predetermined_heuristic
  never_call_predetermined_cross_context: true

descriptors:
  n_high_expr_genes: 32
  include_train_response_codes: true
  ntc_of_query_context: allowed_declared_shared_across_arms
  response_derived_features_forbidden_for_unseen_targets: true

models:
  shrunk_transfer:
    prior_sd_grid: [0.5, 1.0, 4.0, 1000000.0]
  lowrank_linear:
    rank_grid: [8, 16]
    ridge_grid: [1.0, 10.0]
  compact_mlp:
    hidden: 24
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
  modular:
    rank_grid: [8, 16]
    hidden: 8
    lr: 0.01
    l2: 0.0001
    epochs: 30
    patience: 6
    batch: 32
    joint_finetune_epochs: 12
    joint_lr: 0.003

evaluation:
  n_boot: 200
  strong_threshold: 0.5
  score_unobserved_as: zero_delta_with_coverage_reported
  save_full_predictions: false

generator_x_predictor:
  execute_six_metrics: false
  reason: no_local_real_perturbed_single_cell_bundle
